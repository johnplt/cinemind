[project]
name = "cinemind"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
