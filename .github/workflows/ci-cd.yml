name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # --- 1. LA PARTIE CI (Tests / Validation) ---
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SCAN DE SECRETS (TruffleHog)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev
        env:
          UV_PYTHON: "3.13"

      - name: Basic Syntax Check
        run: uv run python -m compileall scripts/

      # SCAN DOS & SÉCURITÉ CODE (Bandit)
      - name: Scan des faiblesses de code (Bandit)
        run: uvx bandit -r . -x ./.venv -ll

      # SCAN DE VULNÉRABILITÉS (Trivy)
      - name: Scan des vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

# --- 2. LA PARTIE CD (Build Docker & Déploiement VM) ---
  cd-deploy:
    needs: ci-checks # Attend impérativement que la CI réussisse
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <-- MODIFIÉ : passé de 'read' à 'write' pour autoriser la création de tags
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # <-- MODIFIÉ : mis à 0 (ou au moins un nombre élevé) pour être sûr de récupérer l'historique complet et les tags existants

      - name: Check if app files changed
        id: check_files
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD)
          echo "Fichiers modifiés : $changed_files"
          
          if echo "$changed_files" | grep -qv "^dags/"; then
            echo "app_changed=true" >> $GITHUB_OUTPUT
            echo "Changements détectés hors des DAGs, on procède au déploiement."
          else
            echo "app_changed=false" >> $GITHUB_OUTPUT
            echo "Seuls les DAGs ont changé, on ignore le déploiement de l'app."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check_files.outputs.app_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        if: steps.check_files.outputs.app_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy to Hetzner VM via SSH
        if: steps.check_files.outputs.app_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/apps/cinemind
            git pull origin main
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop cinemind-app || true
            docker rm cinemind-app || true
            docker run -d --name cinemind-app --restart always -p 8501:8501 --env-file /opt/apps/cinemind/.env --network app-network ghcr.io/${{ github.repository }}.latest

      # --- NOUVELLE ÉTAPE : CRÉATION DU TAG DE PRODUCTION ---
      - name: Create and push Production Tag
        # S'exécute uniquement si l'application a réellement été déployée et que les étapes d'avant ont réussi
        if: steps.check_files.outputs.app_changed == 'true' && success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Récupère le dernier tag existant (ex: v1.0.2) ou part de v0.0.0 si aucun tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Dernier tag : $LAST_TAG"

          # Incrémente automatiquement le chiffre "Patch" (vX.Y.Z -> vX.Y.Z+1)
          VERSION_NUM=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$NEW_PATCH"

          echo "Nouveau tag de production généré : $NEW_TAG"

          # Crée et pousse le tag sur le dépôt GitHub
          git tag -a "$NEW_TAG" -m "Production release $NEW_TAG"
          git push origin "$NEW_TAG"