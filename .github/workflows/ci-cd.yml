name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # --- 1. LA PARTIE CI (Tests / Validation) ---
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SCAN DE SECRETS (TruffleHog)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev
        env:
          UV_PYTHON: "3.13"

      - name: Basic Syntax Check
        run: uv run python -m compileall scripts/

      # SCAN DOS & SÉCURITÉ CODE (Bandit)
      - name: Scan des faiblesses de code (Bandit)
        run: uvx bandit -r . -x ./.venv -ll

      # SCAN DE VULNÉRABILITÉS (Trivy)
      - name: Scan des vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # --- 2. LA PARTIE CD (Build Docker & Déploiement VM) ---
  cd-deploy:
    needs: ci-checks # Attend impérativement que la CI réussisse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Indispensable pour comparer le dernier commit avec le précédent

      - name: Check if app files changed
        id: check_files
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD)
          echo "Fichiers modifiés : $changed_files"
          
          # Si le commit contient des modifications en dehors du dossier dags/
          if echo "$changed_files" | grep -qv "^dags/"; then
            echo "app_changed=true" >> $GITHUB_OUTPUT
            echo "Changements détectés hors des DAGs, on procède au déploiement."
          else
            echo "app_changed=false" >> $GITHUB_OUTPUT
            echo "Seuls les DAGs ont changé, on ignore le déploiement de l'app."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check_files.outputs.app_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        if: steps.check_files.outputs.app_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy to Hetzner VM via SSH
        if: steps.check_files.outputs.app_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/apps/cinemind
            git pull origin main
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop cinemind-app || true
            docker rm cinemind-app || true
            docker run -d --name cinemind-app --restart always -p 8501:8501 --env-file /opt/apps/cinemind/.env --network app-network ghcr.io/${{ github.repository }}:latest